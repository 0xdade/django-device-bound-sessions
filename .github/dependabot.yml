version: 2

updates:
  # Workflow actions (pinned by commit SHA with a "# vX.Y.Z" comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases settle before adopting them.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Hook revisions in .pre-commit-config.yaml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: pre-commit

  # uv.lock (development environment and CI).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # This is a library: only move the lockfile. Never raise the minimum
    # versions declared in pyproject.toml (e.g. django>=5.2), which are a
    # compatibility promise to users.
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # A dependency goes to the first group it matches, so order matters:
    # specific groups first, the catch-all last.
    groups:
      # mypy and django-stubs are version-coupled
      # (django-stubs[compatible-mypy] caps mypy), so update them together.
      # ty is pre-1.0, so its updates are the likeliest to fail CI; keeping
      # them here stops them blocking the other groups.
      type-checkers:
        patterns: ["mypy", "django-stubs", "django-stubs-ext", "pyright", "ty"]
      # Our runtime dependencies get their own PR, so a Django or PyJWT
      # change that breaks something is easy to spot.
      runtime:
        patterns: ["django", "pyjwt", "cryptography"]
      # Everything else (pytest, pytest-django, pre-commit, ...).
      dev-tools:
        patterns: ["*"]
    commit-message:
      prefix: deps
